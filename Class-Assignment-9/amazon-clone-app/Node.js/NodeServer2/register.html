<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            background: linear-gradient(135deg, #667eea, #764ba2);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        .register-container {

            width: 100%;

            max-width: 500px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }


        .register-container h1 {

            text-align: center;

            color: #333;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }


        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            color: #333;

            font-weight: bold;
        }


        .form-group input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }


        .form-group input:focus {

            border-color: #667eea;

            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }


        .register-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .register-btn:hover {

            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }


        .login-text {

            text-align: center;

            margin-top: 20px;

            color: #777;
        }


        .login-text a {

            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }


        .login-text a:hover {

            text-decoration: underline;
        }


        @media (max-width: 600px) {

            .register-container {

                padding: 30px 20px;
            }

        }

    </style>

</head>


<body>


    <div class="register-container">

        <h1>Create Account</h1>

        <p class="subtitle">
            Register to get started
        </p>


        <!-- Registration Form -->

        <form method="POST" action="/api/register">


            <!-- First Name -->

            <div class="form-group">

                <label for="firstName">
                    First Name
                </label>

                <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    placeholder="Enter your first name"
                    required
                >

            </div>


            <!-- Last Name -->

            <div class="form-group">

                <label for="lastName">
                    Last Name
                </label>

                <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    placeholder="Enter your last name"
                    required
                >

            </div>


            <!-- Submit Button -->

            <button
                type="submit"
                class="register-btn"
            >
                Register
            </button>


        </form>


        <p class="login-text">

            Already have an account?

            <a href="#">
                Login
            </a>

        </p>


    </div>


</body>

</html>
